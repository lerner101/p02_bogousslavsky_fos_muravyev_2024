[project]
name = "Informed Trading Intensity"
description = "Replication and extension of Bogousslavsky, Fos, and Muravyev (2024)"
maintainer = "Jacob Lerner, Andrew Arbitman, Andrew McLaughlin, Nate Lee"
contributors = ["Jacob Lerner", "Andrew Arbitman", "Andrew McLaughlin", "Nate Lee"]
os_compatibility = ["Windows", "Linux", "macOS"]
requires_chartbook = ">=0.4.0"

[scripts]
build = "doit"

[notebooks.iti_replication]
description = "Tour of the cleaned panel, the 13D labels and the replicated exhibits."
path = "_output/01_iti_replication.ipynb"

# ---------------------------------------------------------------- dataframes

# Licensed row-level data (13D labels with CRSP fields) are deliberately not
# registered: the site is public and built from a clean clone.

[dataframes.replication_scorecard]
name = "Replication scorecard"
description = "Every replicated number next to the published value, with the ratio and pass/fail under the fixed tolerance (same sign, within a factor of 3)."
sources = ["_output/replication/*.csv", "_output/figure_04c_preview.csv", "_output/ml_model/model_performance.csv", "Paper tables (src/paper_values.py)"]
pull_method = "src/replication_scorecard.py"
path = "_output/report/scorecard.csv"
docs = "Built by src/replication_scorecard.py from the committed replication outputs and the published values transcribed in src/paper_values.py. Status is 'pass' when the estimate has the paper's sign and ours/paper is in [1/3, 3]; when the paper's own estimate is insignificant we only require the same sign or an insignificant estimate. Rows marked 'not comparable' have different units by construction."

[dataframes.table5]
name = "Table 5: return reversal and ITI(13D)"
description = "Next-day return on today's return, ITI(13D) and interactions; date FE, stock/date clustered."
sources = ["CRSP daily stock file", "WRDS Intraday Indicators", "Authors' posted ITI (original vintage)"]
pull_method = "src/build_panel.py then src/replicate_exhibits.py table5"
path = "_output/replication/table5.csv"
docs = "Coefficient and t-statistic per regression column. Column '2 (col 3 sample)' re-estimates column 2 on the column 3 sample."

[dataframes.table10]
name = "Table 10: ITI and next-month returns"
description = "Weekly panel regressions of next-month returns on prior-week ITI measures; week FE, stock/week clustered."
sources = ["CRSP daily stock file", "CRSP delistings", "Fama-French daily factors", "Authors' posted ITI (original vintage)"]
pull_method = "src/build_panel.py then src/replicate_exhibits.py table10"
path = "_output/replication/table10.csv"
docs = "Coefficient and t-statistic per regression column, 2005-01 to 2019-07."

[dataframes.table11]
name = "Table 11: ITI decile portfolios"
description = "Equal-weighted decile portfolios on prior-week ITI: monthly raw returns and FF4 alphas with Newey-West t-statistics."
sources = ["CRSP daily stock file", "Fama-French daily factors", "Authors' posted ITI (original vintage)"]
pull_method = "src/build_panel.py then src/replicate_exhibits.py table11"
path = "_output/replication/table11.csv"
docs = "One row per measure and portfolio (Low..High, H-L)."

[dataframes.figure1]
name = "Figure 1: annual explanatory power"
description = "Annual adjusted R2 of the 13D trade indicator on held-out ITI(13D) and on liquidity controls, with digitized paper values."
sources = ["Project ITI(13D) held-out predictions", "CRSP daily", "WRDS Intraday Indicators", "Digitized paper curve"]
pull_method = "src/train_iti.py then src/replicate_iti_figures.py"
path = "_output/replication/figure1.csv"
docs = "Project regressions use a common sample per year; paper columns are digitized from the published figure."

[dataframes.figure4a]
name = "Figure 4(a): ITI around earnings"
description = "Event-day coefficients of ITI(13D) around earnings announcements, stock FE, two-way clustered."
sources = ["Compustat quarterly earnings dates", "CRSP-Compustat links", "Authors' posted ITI (original vintage)"]
pull_method = "src/replicate_exhibits.py fig4"
path = "_output/replication/figure4a.csv"
docs = "Day 0 is the higher-volume of the reported date and the next trading day."

[dataframes.figureIA5]
name = "Figure IA.5: ITI around M&A announcements"
description = "Event-day coefficients of ITI(13D) around M&A announcements for public US targets."
sources = ["SDC M&A", "CRSP names", "Authors' posted ITI (original vintage)"]
pull_method = "src/replicate_exhibits.py figia5"
path = "_output/replication/figureIA5.csv"
docs = "Completed deals for US public targets, linked by 6-digit CUSIP."

[dataframes.iti_agreement_by_year]
name = "Our ITI(13D) vs the authors' posted ITI(13D)"
description = "Yearly agreement (MAE, RMSE, Pearson, Spearman) between our independently trained ITI(13D) and the authors' series on matched stock-days."
sources = ["Project ITI(13D) scores", "Authors' posted ITI (original vintage)"]
pull_method = "src/score_iti.py then src/compare_iti.py"
path = "_output/ml_model/agreement_by_year.csv"
docs = "Reconstructed training windows are excluded so the comparison is out of sample for our model."

# -------------------------------------------------------------------- charts

[charts.scorecard]
name = "Replication scorecard"
description = "Ratio of each replicated estimate to the published value; shaded band is the x1/3 to x3 tolerance."
dataframe = "replication_scorecard"
path = "_output/report/scorecard.png"
docs = "Built by src/replication_scorecard.py. Each dot is one replicated estimate divided by the published value; blue dots pass the fixed tolerance (same sign, within a factor of 3), red dots fail. See the report for the list of known misses and their causes."

[charts.validation_coverage]
name = "Data coverage and agreement through time"
description = "13D label rows with model inputs by year, and coverage/agreement with the authors' posted ITI."
dataframe = "iti_agreement_by_year"
path = "_output/report/validation_coverage.png"
docs = "Built by src/validation_exhibits.py from committed validation outputs. Panel (a) shows label rows with complete model inputs (2019 drops by design: 13D training ends in 2018). Panel (b) shows coverage of and correlation with the authors' posted ITI(13D)."

[charts.figure1]
name = "Figure 1: annual explanatory power"
description = "ITI beats liquidity controls every year; level is about half the paper's."
dataframe = "figure1"
path = "_output/replication/figure1.png"
docs = "Built by src/replicate_iti_figures.py. Solid lines are our out-of-sample regressions; dashed lines are the paper's curves, digitized."

[charts.figure4a]
name = "Figure 4(a): ITI around earnings announcements"
description = "ITI rises two days before, peaks on day 0, and decays, as in the paper."
dataframe = "figure4a"
path = "_output/replication/figure4a.png"
docs = "Built by src/replicate_exhibits.py. Error bars are 95% intervals; dashed line is the paper's curve read off the figure."

[charts.figureIA5]
name = "Figure IA.5: ITI around M&A announcements"
description = "ITI jumps after M&A announcements and decays over ten days."
dataframe = "figureIA5"
path = "_output/replication/figureIA5.png"
docs = "Built by src/replicate_exhibits.py. Error bars are 95% intervals; dashed line is the paper's curve read off the figure."
