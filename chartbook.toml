[project]
name = "Informed Trading Intensity"
description = "Replication and extension of Bogousslavsky, Fos, and Muravyev (2024)"
maintainer = "Jacob Lerner, Andrew Arbitman, Andrew McLaughlin, Nate Lee"
contributors = ["Jacob Lerner", "Andrew Arbitman", "Andrew McLaughlin", "Nate Lee"]
os_compatibility = ["Windows", "Linux", "macOS"]
requires_chartbook = ">=0.4.0"

[scripts]
build = "doit"

# Register project artifacts here as they are implemented.
[notebooks]

[dataframes.labels_13d_daily]
name = "Schedule 13D trade-day labels"
description = "One row per rebuilt 13D event and trading day in its 60-calendar-day window: whether the filer traded (itrade) and the signed dollar amount (ivol), in the authors' label layout."
path = "_data/derived/13d/labels_daily.parquet"
docs = "Built by src/build_13d_labels.py from WRDS SC 13D filing text (2005-2019). Columns follow src/schema_13d.py. Licensed CRSP fields (prc, shrout, vol) are included; do not redistribute. See the 13D section of the methodology page for screens and extraction accuracy."

[charts]
